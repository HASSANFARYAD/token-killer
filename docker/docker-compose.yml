version: '3.9'

services:
  sesshush-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - sesshush-data:/data
    environment:
      NODE_ENV: production
      SESSHUSH_DB_PATH: /data/sesshush.db
      SESSHUSH_JWT_SECRET: ${SESSHUSH_JWT_SECRET:?Required — set in .env}
      SESSHUSH_ENCRYPTION_KEY: ${SESSHUSH_ENCRYPTION_KEY:?Required — set in .env}
      SESSHUSH_BASE_URL: ${SESSHUSH_BASE_URL:-http://localhost:3000}

      # Microsoft OAuth (optional — omit for local-auth-only deployments)
      SESSHUSH_MS_CLIENT_ID: ${SESSHUSH_MS_CLIENT_ID:-}
      SESSHUSH_MS_CLIENT_SECRET: ${SESSHUSH_MS_CLIENT_SECRET:-}
      SESSHUSH_MS_TENANT_ID: ${SESSHUSH_MS_TENANT_ID:-common}
      SESSHUSH_MS_REDIRECT_URI: ${SESSHUSH_MS_REDIRECT_URI:-http://localhost:3000/api/auth/microsoft/callback}

      SESSHUSH_LOG_LEVEL: ${SESSHUSH_LOG_LEVEL:-info}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Optional: SMTP relay for invite emails
  # mailhog:
  #   image: mailhog/mailhog
  #   ports:
  #     - "1025:1025"
  #     - "8025:8025"

volumes:
  sesshush-data:
    driver: local
