version: '3.9'

services:
  rtk-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - rtk-data:/data
    environment:
      NODE_ENV: production
      RTK_DB_PATH: /data/rtk.db
      RTK_JWT_SECRET: ${RTK_JWT_SECRET:?Required — set in .env}
      RTK_ENCRYPTION_KEY: ${RTK_ENCRYPTION_KEY:?Required — set in .env}
      RTK_BASE_URL: ${RTK_BASE_URL:-http://localhost:3000}

      # Microsoft OAuth (optional — omit for local-auth-only deployments)
      RTK_MS_CLIENT_ID: ${RTK_MS_CLIENT_ID:-}
      RTK_MS_CLIENT_SECRET: ${RTK_MS_CLIENT_SECRET:-}
      RTK_MS_TENANT_ID: ${RTK_MS_TENANT_ID:-common}
      RTK_MS_REDIRECT_URI: ${RTK_MS_REDIRECT_URI:-http://localhost:3000/api/auth/microsoft/callback}

      RTK_LOG_LEVEL: ${RTK_LOG_LEVEL:-info}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Optional: SMTP relay for invite emails
  # mailhog:
  #   image: mailhog/mailhog
  #   ports:
  #     - "1025:1025"
  #     - "8025:8025"

volumes:
  rtk-data:
    driver: local
